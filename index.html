<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>POS Abarrotes &amp; Granel</title>
    <meta name="description" content="Sistema Punto de Venta (POS) Neo-Brutalista offline-first para abarrotes, pesaje a granel, control de inventario y arqueo de turnos." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#ffcc00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POS Granel" />
    <meta name="application-name" content="POS Granel" />
    
    <!-- PWA Manifest & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    
    <!-- Open Graph & Security -->
    <meta property="og:title" content="POS Abarrotes &amp; Granel" />
    <meta property="og:description" content="Sistema Punto de Venta (POS) Neo-Brutalista offline-first para abarrotes, pesaje a granel, control de inventario y arqueo de turnos." />
    <meta property="og:type" content="website" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('debug-err-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-err-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:12px;font-family:monospace;font-size:12px;z-index:999999;word-break:break-all;';
          if (document.body) document.body.appendChild(el);
          else window.addEventListener('DOMContentLoaded', function() { document.body.appendChild(el); });
        }
        el.innerText = 'JS ERR: ' + msg + ' (' + (url || '') + ':' + (line || '') + ') ' + (error && error.stack ? error.stack : '');
      };
      window.onunhandledrejection = function(e) {
        var el = document.getElementById('debug-err-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-err-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:12px;font-family:monospace;font-size:12px;z-index:999999;word-break:break-all;';
          if (document.body) document.body.appendChild(el);
          else window.addEventListener('DOMContentLoaded', function() { document.body.appendChild(el); });
        }
        el.innerText = 'PROMISE REJ: ' + (e.reason && (e.reason.message || e.reason.stack || e.reason));
      };
    </script>
  </head>
  <body class="bg-[#f5f0e8] text-[#1a1a1a] antialiased select-none min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
